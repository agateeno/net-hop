<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 20 20">
  <!-- "PRE" badge for the 20px icon. A 3x5 pixel font on whole pixels. -->
  <rect x="7" y="13" width="13" height="7" rx="1" fill="#242424" />
  <g fill="#FFFFFF" shape-rendering="crispEdges">
    <!-- P -->
    <rect x="8" y="14" width="2" height="1" /><rect x="8" y="15" width="1" height="4" />
    <rect x="10" y="15" width="1" height="1" /><rect x="9" y="16" width="1" height="1" />
    <!-- R -->
    <rect x="12" y="14" width="2" height="1" /><rect x="12" y="15" width="1" height="4" />
    <rect x="14" y="15" width="1" height="1" /><rect x="13" y="16" width="1" height="1" />
    <rect x="14" y="17" width="1" height="2" />
    <!-- E -->
    <rect x="16" y="14" width="3" height="1" /><rect x="16" y="15" width="1" height="3" />
    <rect x="17" y="16" width="1" height="1" /><rect x="16" y="18" width="3" height="1" />
  </g>
</svg>
