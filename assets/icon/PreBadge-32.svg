  <g fill="#FFFFFF" shape-rendering="crispEdges">
    <!-- P -->
    <rect x="15" y="22" width="3" height="1" /><rect x="15" y="23" width="1" height="5" />
    <rect x="18" y="23" width="1" height="2" /><rect x="16" y="25" width="2" height="1" />
    <!-- R -->
    <rect x="20" y="22" width="3" height="1" /><rect x="20" y="23" width="1" height="5" />
    <rect x="23" y="23" width="1" height="2" /><rect x="21" y="25" width="2" height="1" />
    <rect x="22" y="26" width="1" height="1" /><rect x="23" y="27" width="1" height="1" />
    <!-- E -->
    <rect x="25" y="22" width="4" height="1" /><rect x="25" y="23" width="1" height="4" />
    <rect x="26" y="24" width="2" height="1" /><rect x="25" y="27" width="4" height="1" />
  </g>
</svg>
