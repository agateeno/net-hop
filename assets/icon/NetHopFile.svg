<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!--
    Icon of .nethop profile files (48px and larger): a white sheet with a folded corner holding
    the Wi-Fi and Ethernet symbols of the app icon. 20-32px: NetHopFile-small.svg, 16px: NetHopFile-16.svg.
  -->
  <defs>
    <linearGradient id="sheet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" />
      <stop offset="1" stop-color="#EEF1F6" />
    </linearGradient>
    <linearGradient id="fold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E3E8EF" />
      <stop offset="1" stop-color="#C9D1DC" />
    </linearGradient>
    <linearGradient id="glyph" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#36A3F2" />
      <stop offset="1" stop-color="#0F6CBD" />
    </linearGradient>
  </defs>

  <!-- Sheet with the top-right corner folded -->
  <path fill="url(#sheet)" stroke="#000000" stroke-opacity="0.14" stroke-width="2"
        d="M64 20 H160 L212 72 V220 Q212 236 196 236 H64 Q48 236 48 220 V36 Q48 20 64 20 Z" />
  <path fill="url(#fold)" d="M160 20 V60 Q160 72 172 72 H212 Z" />
  <path fill="none" stroke="#000000" stroke-opacity="0.10" stroke-width="2" d="M160 21 V60 Q160 71 172 71 H211" />

  <!-- Wi-Fi: three arcs and a dot, centered at (130, 118) -->
  <g fill="none" stroke="url(#glyph)" stroke-width="9" stroke-linecap="round">
    <path d="M94 92 A50 50 0 0 1 166 92" />
    <path d="M106 104 A33 33 0 0 1 154 104" />
    <path d="M118 115 A16 16 0 0 1 142 115" />
  </g>
  <circle cx="130" cy="124" r="7" fill="url(#glyph)" />

  <!-- Ethernet (RJ45) jack: body with the latch notch at the bottom, and four contacts -->
  <path fill="url(#glyph)" fill-rule="evenodd"
        d="M100 154 H160 Q166 154 166 160 V190 Q166 196 160 196 H144 V204 Q144 208 140 208 H120 Q116 208 116 204 V196 H100 Q94 196 94 190 V160 Q94 154 100 154 Z
           M105 164 V186 H155 V164 Z" />
  <rect x="111" y="167" width="5" height="10" rx="1.2" fill="url(#glyph)" />
  <rect x="121" y="167" width="5" height="10" rx="1.2" fill="url(#glyph)" />
  <rect x="134" y="167" width="5" height="10" rx="1.2" fill="url(#glyph)" />
  <rect x="144" y="167" width="5" height="10" rx="1.2" fill="url(#glyph)" />
</svg>
