<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <!-- "PRE" badge for NetHop-16.svg. A 3x5 pixel font on whole pixels. -->
  <rect x="3" y="9" width="13" height="7" rx="1" fill="#242424" />
  <g fill="#FFFFFF" shape-rendering="crispEdges">
    <!-- P -->
    <rect x="4" y="10" width="2" height="1" /><rect x="4" y="11" width="1" height="4" />
    <rect x="6" y="11" width="1" height="1" /><rect x="5" y="12" width="1" height="1" />
    <!-- R -->
    <rect x="8" y="10" width="2" height="1" /><rect x="8" y="11" width="1" height="4" />
    <rect x="10" y="11" width="1" height="1" /><rect x="9" y="12" width="1" height="1" />
    <rect x="10" y="13" width="1" height="2" />
    <!-- E -->
    <rect x="12" y="10" width="3" height="1" /><rect x="12" y="11" width="1" height="3" />
    <rect x="13" y="12" width="1" height="1" /><rect x="12" y="14" width="3" height="1" />
  </g>
</svg>
