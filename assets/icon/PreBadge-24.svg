<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
  <!-- "PRE" badge for the 24px icon. A 4x6 pixel font on whole pixels. -->
  <rect x="8" y="16" width="16" height="8" rx="1.5" fill="#242424" />
  <g fill="#FFFFFF" shape-rendering="crispEdges">
    <!-- P -->
    <rect x="9" y="17" width="3" height="1" /><rect x="9" y="18" width="1" height="5" />
    <rect x="12" y="18" width="1" height="2" /><rect x="10" y="20" width="2" height="1" />
    <!-- R -->
    <rect x="14" y="17" width="3" height="1" /><rect x="14" y="18" width="1" height="5" />
    <rect x="17" y="18" width="1" height="2" /><rect x="15" y="20" width="2" height="1" />
    <rect x="16" y="21" width="1" height="1" /><rect x="17" y="22" width="1" height="1" />
    <!-- E -->
    <rect x="19" y="17" width="4" height="1" /><rect x="19" y="18" width="1" height="4" />
    <rect x="20" y="19" width="2" height="1" /><rect x="19" y="22" width="4" height="1" />
  </g>
</svg>
